<html lang="fr"><head><meta charset="utf-8">

<link rel="manifest" href="manifest.webmanifest">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>TCM Animation</title>
<meta name="claude:viewport-fit-sides" content="cover">

</head><body>
<style>
/* Layout: one-column phone app; each match is drawn as a little blue hard court with its net, players on either side */
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --ink:#12263A; --muted:#5A6C7E; --line:#D3DCE4;
  --court:#1D5C9E; --court-2:#174C84; --chalk:#FFFFFF; --ball:#CFE04A; --ball-ink:#273000;
  --ok:#24804F; --danger:#B3261E;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1721; --surface:#15222E; --ink:#E5EDF4; --muted:#92A5B7; --line:#283A4A;
  --court:#1F5797; --court-2:#18467A; --chalk:#F2F6FA; --ball:#D4E55A; --ball-ink:#222A00;
  --ok:#5CC48A; --danger:#F08A82; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1721; --surface:#15222E; --ink:#E5EDF4; --muted:#92A5B7; --line:#283A4A;
  --court:#1F5797; --court-2:#18467A; --chalk:#F2F6FA; --ball:#D4E55A; --ball-ink:#222A00;
  --ok:#5CC48A; --danger:#F08A82; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
#app{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}
h1,h2,h3{font-family:var(--display);letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:2rem;text-transform:uppercase}
h2{font-size:1.35rem;text-transform:uppercase}
h3{font-size:1.1rem}
.eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:8px 16px;border-bottom:3px solid var(--ink);margin-bottom:16px}
.top .ballmark{width:34px;height:34px;border-radius:50%;background:var(--ball);position:relative;flex:none;overflow:hidden}
.top .ballmark::before,.top .ballmark::after{content:"";position:absolute;width:34px;height:34px;border:2px solid var(--surface);border-radius:50%}
.top .ballmark::before{left:-22px}.top .ballmark::after{right:-22px}
button{font:inherit;font-weight:600;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;cursor:pointer;min-height:44px}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
.btn-main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn-ball{background:var(--ball);color:var(--ball-ink);border-color:var(--ball)}
.btn-ghost{background:transparent;border-color:transparent;padding-inline:6px;color:var(--muted)}
.btn-danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn-sm{min-height:36px;padding:6px 10px;font-size:.9rem}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.9rem}
input[type=text],input[type=date],input[type=number],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;box-sizing:border-box}
textarea{min-height:120px;resize:vertical}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.anim-card{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;width:100%;padding:14px 16px;border-radius:14px}
.anim-card .t{font-family:var(--display);font-size:1.3rem;font-weight:700}
.anim-card .n{font-family:var(--display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;line-height:1}
.anim-card .n small{display:block;font-family:var(--body);font-size:.7rem;font-weight:500;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-block:12px 16px;border-bottom:1.5px solid var(--line)}
.tabs button{border:none;border-radius:0;background:none;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap;padding-inline:12px;font-family:var(--display);font-size:1.1rem;text-transform:uppercase;letter-spacing:.03em}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ball)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.kpis{display:flex;gap:16px;font-variant-numeric:tabular-nums}
.kpis b{font-family:var(--display);font-size:1.5rem;display:block;line-height:1}
.kpis span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.defi-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--ball);border-radius:12px;padding:10px 12px;margin-bottom:14px}
.defi-bar select{flex:1 1 200px;width:auto}
.courts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
@media (max-width:360px){.courts{grid-template-columns:1fr}}
.court{background:var(--court);color:var(--chalk);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:10px}
.court.over{box-shadow:0 0 0 4px var(--ball)}
.court.over .chip{background:var(--danger);color:#fff}
@media (prefers-reduced-motion:no-preference){.court.over{animation:pulse 1.2s ease-in-out infinite}}
@keyframes pulse{50%{box-shadow:0 0 0 8px var(--ball)}}
.dur{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.dur b{margin-right:4px}
.dur button{min-height:38px;padding:6px 12px;font-size:.95rem;font-variant-numeric:tabular-nums}
.dur button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.nx{display:flex;align-items:center;gap:12px}
.nx .rank{flex:none;width:34px;height:34px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:1.2rem}
.nx.first{background:color-mix(in srgb,var(--ball) 28%,var(--surface))}
.nx.first .rank{background:var(--ball);color:var(--ball-ink)}
.court.next{background:var(--surface);color:var(--ink);border:1.5px dashed var(--line)}
.court-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.court-num{font-family:var(--display);font-size:1.25rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.chip{font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--ball);color:var(--ball-ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.court.next .chip{background:var(--bg);color:var(--muted)}
.surface{border:2px solid var(--chalk);border-radius:4px;background:var(--court-2);display:grid;grid-template-rows:1fr auto 1fr;min-height:110px}
.side{display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 8px;font-family:var(--display);font-size:1.35rem;font-weight:600;line-height:1.15;min-width:0;overflow-wrap:anywhere}
.net{height:0;border-top:2px dashed var(--chalk);position:relative}
.net span{position:absolute;right:6px;top:-9px;font-size:.65rem;letter-spacing:.12em;background:var(--court-2);padding-inline:4px;text-transform:uppercase}
.next-line{font-family:var(--display);font-size:1.25rem;font-weight:600;line-height:1.2}
.next-line .vs{font-family:var(--body);font-size:.85rem;color:var(--muted);font-weight:500;margin-inline:6px}
.defi-tag{display:flex;flex-direction:column;gap:6px;background:rgba(255,255,255,.12);border-radius:10px;padding:8px 10px}
.court.next .defi-tag{background:var(--bg)}
.defi-tag .lbl{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;opacity:.85}
.defi-tag .txt{font-weight:600}
.defi-tag select{background:rgba(255,255,255,.95);color:#12263A;min-height:38px;padding:6px 10px}
.court.next .defi-tag select{background:var(--surface);color:var(--ink)}
.check{display:flex;align-items:center;gap:8px;font-weight:600;min-height:40px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--ball);flex:none}
.counter{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.counter .lab{font-weight:600;flex:1 1 140px}
.counter button{width:44px;height:44px;padding:0;border-radius:50%;font-size:1.4rem;line-height:1}
.counter b{font-family:var(--display);font-size:1.8rem;min-width:1.4em;text-align:center;font-variant-numeric:tabular-nums}
.back-btn{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--ball)!important;color:var(--ball-ink)!important;border-color:var(--ball)!important;font-size:1.05rem;min-height:50px}
.back-btn i{width:22px;height:22px;border:2.5px solid var(--ball-ink);border-radius:6px;display:inline-block}
.court button{border-color:rgba(255,255,255,.4);background:transparent;color:var(--chalk)}
.court.next button{border-color:var(--line);color:var(--ink)}
.result{display:flex;flex-direction:column;gap:8px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-height:38px;padding:6px 10px;font-size:.9rem}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bench{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font-weight:500;font-size:.92rem}
.pill b{font-family:var(--display);font-variant-numeric:tabular-nums;background:var(--bg);border-radius:999px;padding:0 7px}
.pill.away{opacity:.5;text-decoration:line-through}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.list>*{padding:12px 14px;border-top:1px solid var(--line)}
.list>*:first-child{border-top:none}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px}
.li .grow{min-width:0;flex:1}
.toggle{display:flex;align-items:center;gap:6px;font-size:.9rem;font-weight:600}
.toggle input{width:22px;height:22px;accent-color:var(--ok)}
.radio{display:flex;align-items:center;gap:6px;font-size:.85rem;font-weight:600;white-space:nowrap}
.radio input{width:20px;height:20px;accent-color:var(--ok)}
.li.current{background:color-mix(in srgb,var(--ball) 22%,var(--surface))}
.done-match .who{font-weight:600}
.done-match .who .w{color:var(--ok)}
.ok{color:var(--ok);font-weight:600}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;font-variant-numeric:tabular-nums;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right}
tr.click{cursor:pointer}
tr.open td{background:var(--bg)}
.detail td{white-space:normal;background:var(--bg);font-size:.92rem}
.matrix th.v{writing-mode:vertical-rl;transform:rotate(180deg);text-transform:none;letter-spacing:0;font-size:.82rem;color:var(--ink);padding:8px 4px;vertical-align:bottom;max-height:160px;white-space:normal}
.matrix td{text-align:center;padding:6px 4px;min-width:26px}
.matrix td.z{color:var(--line)}
.matrix td.h1{background:color-mix(in srgb,var(--court) 18%,transparent)}
.matrix td.h2{background:color-mix(in srgb,var(--court) 40%,transparent);font-weight:700}
.matrix td.g1{background:color-mix(in srgb,var(--ok) 20%,transparent)}
.matrix td.g2{background:color-mix(in srgb,var(--ok) 42%,transparent);font-weight:700}
.matrix td.self{background:var(--bg)}
.matrix td.tot{font-weight:700;border-left:1.5px solid var(--line)}
.matrix th.rowh{position:sticky;left:0;background:var(--surface);color:var(--ink);text-transform:none;letter-spacing:0;font-size:.85rem}
.empty{text-align:center;padding:28px 16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.note{font-size:.85rem;color:var(--muted)}
.court .note{color:inherit;opacity:.8}
</style>

<div id="app"></div>
<div id="toast" class="toast" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
const FORMATS={
  bo3:"2 sets gagnants",
  tb7:"Tie-break en 7 points",
  tb10:"Tie-break en 10 points",
  court:"2 jeux gagnants, point décisif, tie-break en 2 points d'écart",
  defis:"Défis à valider (sans compter les points)",
  libre:"Jeu libre (sans points ni défi)"
};
const FORMAT_SHORT={bo3:"2 sets gagnants",tb7:"TB 7 pts",tb10:"TB 10 pts",court:"2 jeux · point décisif",defis:"Défis",libre:"Jeu libre"};
const LS_KEY="tennis-animations-v1";

let store={animations:{}};
let view={animId:null,tab:"matchs",creating:false,openPlayer:null,editMatch:null,confirmDel:null};
let db=null;
const dirty={}, timers={}, chains={}, knownRemote=new Set();

const $app=document.getElementById("app");
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmtDate=s=>{if(!s)return"";const [y,m,d]=s.split("-");return d+"/"+m+"/"+y};
const plural=(n,w)=>n+" "+w+(n>1?"s":"");

function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,3200)}

/* ---------- persistence (Supabase) ---------- */
let sb=null, online=false, needLogin=false, userEmail="";
function loadLocal(){try{const raw=localStorage.getItem(LS_KEY);if(raw){const p=JSON.parse(raw);if(p&&p.animations)store=p}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(store))}catch(e){}}
function commit(a){a.updatedAt=Date.now();store.animations[a.id]=a;saveLocal();queueDb(a.id);render()}
function queueDb(id){
  if(!online)return;
  dirty[id]=true;
  clearTimeout(timers[id]);
  timers[id]=setTimeout(()=>{timers[id]=null;chains[id]=(chains[id]||Promise.resolve()).then(()=>writeDoc(id,0))},500);
}
async function writeDoc(id,attempt){
  const a=store.animations[id];
  const r=a
    ? await sb.from("animations").upsert({id,data:a,updated_at:new Date().toISOString()})
    : await sb.from("animations").delete().eq("id",id);
  if(!r.error){if(!timers[id])dirty[id]=false;return}
  if(attempt<2){await new Promise(res=>setTimeout(res,1500+Math.random()*1500));return writeDoc(id,attempt+1)}
  toast("Pas de connexion à la base : les données restent sur ce téléphone et repartiront à la prochaine modification.");
}
function applyRemote(rows,first){
  let changed=false;const seen=new Set();
  rows.forEach(r=>{
    seen.add(r.id);knownRemote.add(r.id);
    if(dirty[r.id]||!r.data)return;
    const cur=store.animations[r.id];
    if(!cur||(r.data.updatedAt||0)>(cur.updatedAt||0)){store.animations[r.id]=r.data;changed=true}
  });
  if(first)Object.keys(store.animations).forEach(id=>{if(!seen.has(id)&&!dirty[id])queueDb(id)});
  if(changed){saveLocal();render()}
}
async function connectDb(){
  const cfg=window.TCM_CONFIG||{};
  if(!cfg.supabaseUrl||!cfg.supabaseAnonKey||!window.supabase){toast("Supabase n'est pas configuré : les données restent sur ce téléphone.");return}
  sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true}});
  const {data}=await sb.auth.getSession();
  if(!data||!data.session){needLogin=true;render();return}
  startSync(data.session);
}
async function startSync(session){
  needLogin=false;userEmail=(session&&session.user&&session.user.email)||"";
  online=true;
  const {data,error}=await sb.from("animations").select("id,data");
  if(error){online=false;toast("Base injoignable pour l'instant : tu travailles sur les données du téléphone.");render();return}
  applyRemote(data,true);
  sb.channel("tcm-animations").on("postgres_changes",{event:"*",schema:"public",table:"animations"},p=>{
    if(p.eventType==="DELETE"){
      const id=p.old&&p.old.id;
      if(id&&!dirty[id]&&store.animations[id]){delete store.animations[id];saveLocal();if(view.animId===id)view.animId=null;render()}
    }else if(p.new)applyRemote([p.new],false);
  }).subscribe();
  render();
}
function renderLogin(){
  return `<header class="top"><div><div class="eyebrow">Tennis Club · animations</div><h1>TCM Animation</h1></div><div class="ballmark" aria-hidden="true"></div></header>
  <form class="panel stack" id="login-form">
    <h2>Connexion</h2>
    <label class="f">E-mail<input type="email" id="l-email" autocomplete="username" required style="font:inherit;min-height:44px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);color:var(--ink)"></label>
    <label class="f">Mot de passe<input type="password" id="l-pass" autocomplete="current-password" required style="font:inherit;min-height:44px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);color:var(--ink)"></label>
    <div><button type="submit" class="btn-main">Se connecter</button></div>
    <p class="note">Le compte est créé par l'administrateur du club dans Supabase. Une fois connecté, tu restes connecté sur ce téléphone.</p>
  </form>`;
}
document.addEventListener("submit",async e=>{
  if(e.target.id!=="login-form")return;
  e.preventDefault();e.stopPropagation();
  const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById("l-email").value.trim(),password:document.getElementById("l-pass").value});
  if(error){toast("E-mail ou mot de passe incorrect.");return}
  startSync(data.session);
},true);
document.addEventListener("click",async e=>{
  if(!e.target.closest('[data-act="logout"]'))return;
  await sb.auth.signOut();online=false;needLogin=true;render();
});

/* ---------- domain ---------- */
function norm(a){
  if(a.live==null)a.live=6;
  if(a.queue==null)a.queue=2;
  if(a.duration===undefined)a.duration=null;
  a.defis=a.defis||[];
  if(a.currentDefi&&!a.defis.some(d=>d.id===a.currentDefi))a.currentDefi=null;
  a.matches=(a.matches||[]).filter(m=>m.status!=="cancelled");
  a.matches.forEach(m=>{if(m.defiId===undefined)m.defiId=null;if(m.defiCount==null)m.defiCount=m.defiOk?1:0;if(m.defiCount>1)m.defiCount=1});
  return a;
}
const anim=()=>{const a=store.animations[view.animId];return a?norm(a):a};
const pName=(a,id)=>{const p=a.players.find(x=>x.id===id);return p?p.name:"?"};
const team=(a,ids)=>ids.map(id=>pName(a,id)).join(" / ");
const pairKey=(x,y)=>x<y?x+"|"+y:y+"|"+x;
const need=a=>a.type==="double"?4:2;
const defiText=(a,id)=>{const d=a.defis.find(x=>x.id===id);return d?d.text:""};

function newAnimation(o){
  return {id:uid(),name:o.name,date:o.date,type:o.type,format:o.format,live:o.live,queue:o.queue,
    players:o.names.map(n=>({id:uid(),name:n,present:true})),defis:[],currentDefi:null,matches:[],seq:0,createdAt:Date.now(),updatedAt:Date.now()};
}
function tally(a,statuses){
  const played={},met={},partner={},wins={},defis={},defisBy={};
  a.players.forEach(p=>{played[p.id]=0;wins[p.id]=0;defis[p.id]=0;defisBy[p.id]={}});
  a.matches.forEach(m=>{
    if(!statuses.includes(m.status))return;
    const all=m.a.concat(m.b);
    all.forEach(id=>{played[id]=(played[id]||0)+1});
    m.a.forEach(x=>m.b.forEach(y=>{const k=pairKey(x,y);met[k]=(met[k]||0)+1}));
    [m.a,m.b].forEach(t=>{if(t.length===2){const k=pairKey(t[0],t[1]);partner[k]=(partner[k]||0)+1}});
    if(m.winner==="A")m.a.forEach(id=>wins[id]=(wins[id]||0)+1);
    if(m.winner==="B")m.b.forEach(id=>wins[id]=(wins[id]||0)+1);
    const dc=m.defiId?(m.defiCount||0):0;if(dc)all.forEach(id=>{defis[id]=(defis[id]||0)+dc;if(defisBy[id])defisBy[id][m.defiId]=(defisBy[id][m.defiId]||0)+dc});
  });

}
const byStatus=(a,s)=>a.matches.filter(m=>m.status===s).sort((x,y)=>x.seq-y.seq);
function engaged(a){const s=new Set();a.matches.forEach(m=>{if(m.status==="planned"||m.status==="playing")m.a.concat(m.b).forEach(id=>s.add(id))});return s}
function available(a){const e=engaged(a);return a.players.filter(p=>p.present&&!p.removed&&!e.has(p.id))}
const active=a=>a.players.filter(p=>!p.removed);
/* A paused or removed player leaves the upcoming matches; those matches are redrawn */
function dropFromPlanned(a,pid){
  const hit=a.matches.filter(m=>m.status==="planned"&&m.a.concat(m.b).includes(pid));
  if(!hit.length)return 0;
  a.matches=a.matches.filter(m=>!hit.includes(m));
  refill(a);
  return hit.length;
}
function isPlaying(a,pid){return a.matches.some(m=>m.status==="playing"&&m.a.concat(m.b).includes(pid))}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function combos(arr,k){const out=[];(function rec(start,cur){if(cur.length===k){out.push(cur.slice());return}for(let i=start;i<arr.length;i++){cur.push(arr[i]);rec(i+1,cur);cur.pop()}})(0,[]);return out}

/* ---------- draw ----------
   Rules, in order:
   1. Never: a player who just came back is never put in the match that starts next: at least one other match must come back first.
   2. Aim for 2 launches of rest or more, and for the players who have played least and waited longest.
   3. Avoid meeting the same opponent again, and above all an opponent from one of the last 2 matches.
   The upcoming matches stay fixed once shown; new ones are added at the end of the list. */
function launch(a,m){a.launches=(a.launches||0)+1;m.launch=a.launches;m.status="playing";m.startedAt=Date.now()}
function restInfo(a){
  const lastBack={},recent={},recentPartner={};
  const hist=a.matches.filter(m=>m.status==="done"||m.status==="playing").sort((x,y)=>(x.launch||x.seq)-(y.launch||y.seq));
  const lastTwo={};
  hist.forEach(m=>{
    m.a.concat(m.b).forEach(id=>{(lastTwo[id]=lastTwo[id]||[]).push(m);if(lastTwo[id].length>2)lastTwo[id].shift()});
    if(m.status==="done"&&m.backAt!=null)m.a.concat(m.b).forEach(id=>{lastBack[id]=Math.max(lastBack[id]??-1e9,m.backAt)});
  });
  Object.entries(lastTwo).forEach(([id,ms])=>{
    recent[id]=new Set();recentPartner[id]=new Set();
    ms.forEach(m=>{const mine=m.a.includes(id)?m.a:m.b, other=m.a.includes(id)?m.b:m.a;
      other.forEach(o=>recent[id].add(o));mine.forEach(o=>{if(o!==id)recentPartner[id].add(o)})});
  });
  return {lastBack,recent,recentPartner};
}
/* pos = how many matches will start before this one */
function drawMatch(a,pos,avoid){
  const k=need(a);
  const t=tally(a,["planned","playing","done"]);
  const r=restInfo(a);
  const L=a.backs||0;
  const gap=id=>{const b=r.lastBack[id];return b==null?99:L+pos-b};
  let pool=shuffle(available(a).map(p=>p.id)).filter(id=>gap(id)>=1);
  if(pool.length<k)return null;
  const wait=id=>r.lastBack[id]==null?-1e9:r.lastBack[id];
  pool.sort((x,y)=>t.played[x]-t.played[y]||wait(x)-wait(y));
  const min=t.played[pool[0]];
  let cands=pool.filter(id=>t.played[id]<=min+1);
  if(cands.length<Math.max(k,6))cands=pool.slice(0,Math.max(k,8));
  cands=cands.slice(0,12);
  const first=cands[0],rest=cands.slice(1);
  const met=(x,y)=>t.met[pairKey(x,y)]||0, par=(x,y)=>t.partner[pairKey(x,y)]||0;
  const isRecent=(x,y)=>(r.recent[x]&&r.recent[x].has(y))||(r.recent[y]&&r.recent[y].has(x));
  const isRecentP=(x,y)=>(r.recentPartner[x]&&r.recentPartner[x].has(y));
  let best=null;
  combos(rest,k-1).forEach(c=>{
    const all=[first].concat(c);
    let base=c.reduce((s,id)=>s+(t.played[id]-min),0)*3;
    all.forEach(id=>{if(gap(id)<2)base+=4});
    let splits;
    if(k===2)splits=[[[first],[c[0]]]];
    else{const [x,y,z]=c;splits=[[[first,x],[y,z]],[[first,y],[x,z]],[[first,z],[x,y]]]}
    splits.forEach(([A,B])=>{
      let cost=base,rec=false;
      A.forEach(p=>B.forEach(q=>{cost+=met(p,q)*8;if(isRecent(p,q)){cost+=30;rec=true}if(avoid&&avoid.has(pairKey(p,q)))cost+=50}));
      [A,B].forEach(tm=>{if(tm.length===2){cost+=par(tm[0],tm[1])*5;if(isRecentP(tm[0],tm[1]))cost+=15}});
      cost+=Math.random()*0.9;
      if(!best||cost<best.cost)best={a:A,b:B,cost,recent:rec};
    });
  });
  return best;
}
function makeMatch(a,d,status){
  a.seq=(a.seq||0)+1;
  const m={id:uid(),a:d.a,b:d.b,status:"planned",seq:a.seq,winner:null,score:"",defiId:a.format==="defis"?(a.currentDefi||null):null,defiCount:0,startedAt:null,endedAt:null};
  a.matches.push(m);

}
function addMatch(a,status){const pos=status==="playing"?0:byStatus(a,"planned").length;const d=drawMatch(a,pos);if(!d)return false;makeMatch(a,d,status);return true}
/* Keep `live` matches on court, then plan matches for the resting players. `back` = the match that just came back. */
function refill(a,back){
  if(back){a.backs=(a.backs||0)+1;back.backAt=a.backs}
  let guard=0;
  while(byStatus(a,"playing").length<a.live&&guard++<50){
    const nx=byStatus(a,"planned")[0];
    if(nx){launch(a,nx);continue}
    if(!addMatch(a,"playing"))break;
  }
  planQueue(a);
}
function planQueue(a){
  let guard=0;
  while(guard++<30){
    const planned=byStatus(a,"planned").length;
    const d=drawMatch(a,planned);
    if(!d)break;
    if(d.recent&&planned>=2)break; // better to wait for the next return than to replay a recent opponent
    makeMatch(a,d,"planned");
  }

function redrawMatch(a,m){
  const planned=byStatus(a,"planned");const pos=planned.indexOf(m);

  const d=drawMatch(a,pos,avoid);
  if(!d){a.matches.push(m);return false}
  const n=makeMatch(a,d,"planned");a.seq--;n.seq=m.seq;n.defiId=m.defiId;

/* With too few players resting, the same few end up facing each other again: suggest fewer matches at once */
function liveAdvice(a){

  return `<div class="panel stack" style="border-color:var(--ball);margin-bottom:12px"><b>Pas assez de joueuses au repos pour bien mélanger</b><div class="note">Avec ${n} joueuses présentes et ${a.live} matchs en même temps, ${resting>0?"seules "+resting+" joueuses sont":"personne n'est"} au repos : elles se retrouvent souvent entre elles au match suivant. Avec ${rec} match${rec>1?"s":""} en même temps, chacune se repose 1 à 2 matchs et change d'adversaire.</div><div><button class="btn-sm btn-ball" data-act="set-live" data-v="${rec}">Passer à ${rec} match${rec>1?"s":""} en même temps</button></div></div>`;
}
const canRefill=a=>available(a).length>=need(a)&&(byStatus(a,"playing").length<a.live||!!drawMatch(a,byStatus(a,"planned").length));

  h+=`<div class="seg"><button aria-pressed="${m.winner==="A"}" data-act="win" data-id="${m.id}" data-w="A">${esc(A)} gagne</button><button aria-pressed="${m.winner==="B"}" data-act="win" data-id="${m.id}" data-w="B">${esc(B)} gagne</button></div>`;
  if(a.format==="libre")return h+`</div>`;
  if(a.format!=="defis")h+=`<input type="text" id="score-${m.id}" data-act="score" data-id="${m.id}" value="${esc(m.score)}" placeholder="Score, ex. 6/4 3/6 10/8" aria-label="Score">`;
  else{
    h+=`<label class="f">Défi du match${defiSelect(a,m.defiId,`data-act="match-defi" data-id="${m.id}"`)}</label>`;
    if(m.defiId)h+=`<label class="check"><input type="checkbox" data-act="defi-ok" data-id="${m.id}"${m.defiCount?" checked":""}> Défi réussi (validé pour toutes les joueuses du match)</label>`;
  }
  return h+`</div>`;
}
function renderPlayers(a){
  const t=tally(a,["planned","playing","done"]);
  const e=engaged(a);
  let h=`<div class="stack"><div class="panel stack"><label class="f">Ajouter des participants (un nom par ligne)<textarea id="add-players" style="min-height:80px" placeholder="Nom"></textarea></label><div><button class="btn-main" data-act="add-players">Ajouter</button></div></div>`;
  const act=active(a);
  h+=`<p class="note"><b>Pause</b> : la joueuse ne sera plus tirée jusqu'à ce que tu la fasses reprendre. <b>Retirer</b> : elle quitte l'animation, ses matchs déjà joués restent dans les stats. ${act.filter(p=>p.present).length} en jeu sur ${act.length}.</p>`;
  h+=`<div class="list">`;
  act.slice().sort((x,y)=>x.name.localeCompare(y.name,"fr")).forEach(p=>{
    let st=plural(t.played[p.id],"match");
    if(!p.present)st+=" · <b>en pause</b>";
    else if(isPlaying(a,p.id))st+=" · sur le terrain";
    else if(e.has(p.id))st+=" · dans un prochain match";
    const confirm=view.confirmRemove===p.id;
    h+=`<div class="li"><div class="grow"><b>${esc(p.name)}</b><div class="note">${st}</div></div>`;
    if(confirm)h+=`<div class="row"><button class="btn-danger btn-sm" data-act="remove-confirm" data-id="${p.id}">Retirer ${esc(p.name)}</button><button class="btn-ghost btn-sm" data-act="remove-cancel">Annuler</button></div>`;
    else h+=`<div class="row">${p.present?`<button class="btn-sm" data-act="pause" data-id="${p.id}">Pause</button>`:`<button class="btn-ball btn-sm" data-act="resume" data-id="${p.id}">Reprendre</button>`}<button class="btn-ghost btn-sm" data-act="remove-player" data-id="${p.id}">Retirer</button></div>`;
    h+=`</div>`;
  });
  h+=`</div>`;
  const gone=a.players.filter(p=>p.removed);
  if(gone.length)h+=`<h3>Retirées</h3><div class="bench">${gone.map(p=>`<button class="pill btn-sm" data-act="restore" data-id="${p.id}">${esc(p.name)} · Réintégrer</button>`).join("")}</div>`;
  return h+`</div>`;
}
function renderDefis(a){
  const t=tally(a,["playing","done"]);
  let h=`<div class="stack"><div class="panel stack"><label class="f">Nouveau défi<input type="text" id="new-defi" placeholder="Ex. gagner un point au filet"></label><div><button class="btn-main" data-act="add-defi">Ajouter le défi</button></div><p class="note">Coche « En jeu » sur le défi à jouer : il s'affiche sur les prochains matchs. Dès qu'il est réussi, le match s'arrête : la réussite compte pour toutes les joueuses du match. Le même défi peut être réussi à nouveau dans un autre match.</p></div>`;
  if(!a.defis.length)h+=`<p class="muted">Pas encore de défi pour cette animation.</p>`;
  else h+=`<div class="list"><div class="li${!a.currentDefi?" current":""}"><div class="grow"><b>Sans défi</b><div class="note">Les prochains matchs se jouent sans défi.</div></div><label class="radio"><input type="radio" name="cur" data-act="cur-defi-radio" value=""${!a.currentDefi?" checked":""}> En jeu</label></div>${a.defis.map((d,i)=>{
    const n=a.matches.filter(m=>m.defiId===d.id).reduce((s,m)=>s+(m.defiCount||0),0);
    return `<div class="li${a.currentDefi===d.id?" current":""}"><div class="grow"><span class="eyebrow">Défi ${i+1} · ${plural(n,"réussite")}</span><div>${esc(d.text)}</div></div><label class="radio"><input type="radio" name="cur" data-act="cur-defi-radio" value="${d.id}"${a.currentDefi===d.id?" checked":""}> En jeu</label>${a.matches.some(m=>m.defiId===d.id)?"":`<button class="btn-ghost btn-sm" data-act="del-defi" data-id="${d.id}">Supprimer</button>`}</div>`}).join("")}</div>`;
  if(a.defis.length)h+=`<p class="note">Le tableau des défis validés par joueuse est dans l'onglet Stats.</p>`;
  return h+`</div>`;
}
function renderStats(a){
  const t=tally(a,["playing","done"]);
  const players=a.players.slice().sort((x,y)=>t.played[y.id]-t.played[x.id]||x.name.localeCompare(y.name,"fr"));
  const isD=a.format==="defis", isL=a.format==="libre", dbl=a.type==="double";
  const alpha=a.players.slice().sort((x,y)=>x.name.localeCompare(y.name,"fr"));
  let h=`<div class="stack"><p class="note">Matchs en jeu ou terminés. Touche un nom pour voir contre qui elle a joué.</p>`;
  h+=`<div class="tbl-wrap"><table><thead><tr><th>Nom</th><th class="num">Matchs</th>${isD?`<th class="num">Défis</th>`:isL?"":`<th class="num">Victoires</th>`}<th class="num">Adversaires</th></tr></thead><tbody>`;
  players.forEach(p=>{
    const opp=players.filter(q=>q.id!==p.id&&t.met[pairKey(p.id,q.id)]);
    const open=view.openPlayer===p.id;
    h+=`<tr class="click${open?" open":""}" data-act="open-player" data-id="${p.id}"><td><b>${esc(p.name)}</b>${p.removed?` <span class="muted">(retirée)</span>`:p.present?"":` <span class="muted">(pause)</span>`}</td><td class="num">${t.played[p.id]}</td>${isL?"":`<td class="num">${isD?t.defis[p.id]:t.wins[p.id]}</td>`}<td class="num">${opp.length}</td></tr>`;
    if(open){
      const vs=opp.map(q=>({n:q.name,c:t.met[pairKey(p.id,q.id)]})).sort((x,y)=>y.c-x.c);
      let det=`<b>Contre :</b> ${vs.length?vs.map(v=>esc(v.n)+" ×"+v.c).join(", "):"personne pour l'instant"}`;
      if(dbl){const ws=players.filter(q=>q.id!==p.id&&t.partner[pairKey(p.id,q.id)]).map(q=>esc(q.name)+" ×"+t.partner[pairKey(p.id,q.id)]);det+=`<br><b>Avec :</b> ${ws.length?ws.join(", "):"personne pour l'instant"}`}
      const never=players.filter(q=>q.id!==p.id&&q.present&&!q.removed&&!t.met[pairKey(p.id,q.id)]).map(q=>esc(q.name));
      if(never.length)det+=`<br><span class="muted">Pas encore rencontrées : ${never.join(", ")}</span>`;
      h+=`<tr class="detail"><td colspan="${isL?3:4}">${det}</td></tr>`;
    }
  });
  h+=`</tbody></table></div>`;
  if(isD){
    h+=`<h2 style="margin-top:8px">Défis validés</h2><p class="note">Nombre de fois où chaque joueuse a réussi chaque défi.</p>`;
    if(!a.defis.length)h+=`<p class="muted">Aucun défi inscrit pour l'instant.</p>`;
    else{
      h+=`<div class="tbl-wrap"><table class="matrix"><thead><tr><th class="rowh"></th>${a.defis.map((d,i)=>`<th class="v" title="${esc(d.text)}">${i+1}. ${esc(d.text.length>28?d.text.slice(0,27)+"…":d.text)}</th>`).join("")}<th class="v">Total</th></tr></thead><tbody>`;
      alpha.forEach(p=>{
        h+=`<tr><th class="rowh">${esc(p.name)}</th>${a.defis.map(d=>{const c=t.defisBy[p.id][d.id]||0;return`<td class="${c===0?"z":c===1?"g1":"g2"}">${c||"·"}</td>`}).join("")}<td class="tot">${t.defis[p.id]}</td></tr>`;
      });
      h+=`</tbody></table></div>`;
    }
  }
  h+=`<h2 style="margin-top:8px">Qui a joué qui</h2><p class="note">Nombre de fois où deux joueuses se sont affrontées.</p>`;
  h+=`<div class="tbl-wrap"><table class="matrix"><thead><tr><th class="rowh"></th>${alpha.map(q=>`<th class="v">${esc(q.name)}</th>`).join("")}</tr></thead><tbody>`;
  alpha.forEach(p=>{
    h+=`<tr><th class="rowh">${esc(p.name)}</th>${alpha.map(q=>{if(q.id===p.id)return`<td class="self"></td>`;const c=t.met[pairKey(p.id,q.id)]||0;return`<td class="${c===0?"z":c===1?"h1":"h2"}">${c||"·"}</td>`}).join("")}</tr>`;
  });
  return h+`</tbody></table></div></div>`;
}
function renderSettings(a){
  return `<form class="panel stack" id="settings-form">
    <label class="f">Nom<input type="text" id="s-name" value="${esc(a.name)}"></label>
    <div class="grid2"><label class="f">Date<input type="date" id="s-date" value="${esc(a.date)}"></label><label class="f">Type<select id="s-type"><option value="simple"${a.type==="simple"?" selected":""}>Simple</option><option value="double"${a.type==="double"?" selected":""}>Double</option></select></label></div>
    <label class="f">Format<select id="s-format">${formatOptions(a.format)}</select></label>
    <label class="f">Temps par match<select id="s-dur">${[null,5,6,7,10].map(v=>`<option value="${v||""}"${a.duration===v?" selected":""}>${v?v+" minutes":"Libre (pas de chrono)"}</option>`).join("")}</select></label>
    <label class="f">Matchs en même temps<input type="number" id="s-live" min="1" max="20" value="${a.live}"></label>
    <p class="note">Les changements s'appliquent aux prochains tirages.</p>
    <div><button type="submit" class="btn-main">Enregistrer</button></div>
  </form>
  <div class="panel stack" style="margin-top:16px"><h3>Supprimer l'animation</h3><p class="note">Efface les participants, les matchs et les stats de cette animation.</p><div class="row">${view.confirmDel===a.id?`<button class="btn-danger" data-act="delete-confirm">Oui, supprimer définitivement</button><button class="btn-ghost" data-act="delete-cancel">Annuler</button>`:`<button class="btn-danger" data-act="delete">Supprimer</button>`}</div></div>`;
}

/* ---------- events ---------- */
const parseNames=txt=>txt.split(/\n|,|;/).map(s=>s.trim()).filter(Boolean);
const clampInt=(v,lo,hi,def)=>{const n=parseInt(v,10);return isNaN(n)?def:Math.max(lo,Math.min(hi,n))};
function setCurrentDefi(a,id){
  a.currentDefi=id||null;
  // the chosen défi goes on the upcoming matches, and on live matches that have none yet
  a.matches.forEach(m=>{if(m.status==="planned"||(m.status==="playing"&&!m.defiId)){m.defiId=a.currentDefi;m.defiCount=0}});
}
$app.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="create-form"){
    const name=document.getElementById("f-name").value.trim()||"Animation";
    const names=parseNames(document.getElementById("f-players").value);
    const a=newAnimation({name,date:document.getElementById("f-date").value||today(),type:document.getElementById("f-type").value,format:document.getElementById("f-format").value,
      live:clampInt(document.getElementById("f-live").value,1,20,6),queue:0,names});
    view.creating=false;view.animId=a.id;view.tab=names.length?(a.format==="defis"?"defis":"matchs"):"joueurs";commit(a);
  }
  if(e.target.id==="settings-form"){
    const a=anim();
    a.name=document.getElementById("s-name").value.trim()||a.name;
    a.date=document.getElementById("s-date").value||a.date;
    a.type=document.getElementById("s-type").value;a.format=document.getElementById("s-format").value;
    a.live=clampInt(document.getElementById("s-live").value,1,20,a.live);
    {const v=document.getElementById("s-dur").value;a.duration=v?+v:null}
    commit(a);toast("Réglages enregistrés");
  }
});
$app.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  if(el.tagName==="INPUT"||el.tagName==="SELECT")return;
  const act=el.dataset.act;
  const a=anim();
  const findM=()=>a.matches.find(m=>m.id===el.dataset.id);
  switch(act){
    case "new":view.creating=true;render();setTimeout(()=>{const f=document.getElementById("f-name");f&&f.focus()},0);break;
    case "cancel-new":view.creating=false;render();break;
    case "example":{
      const names=["Léa","Chloé","Inès","Manon","Camille","Jade","Louise","Zoé","Lina","Emma","Alice","Rose","Anna","Mila","Lou","Nina","Clara","Sarah","Julia","Eva"];
      const x=newAnimation({name:"Exemple – Après-midi filles",date:today(),type:"simple",format:"defis",live:6,queue:2,names});
      x.defis=[{id:uid(),text:"Gagner un point au filet"},{id:uid(),text:"Faire 5 échanges de suite"},{id:uid(),text:"Servir deux fois dans le carré"}];
      x.currentDefi=x.defis[0].id;
      view.animId=x.id;view.tab="matchs";commit(x);break;}
    case "open":{const o=norm(store.animations[el.dataset.id]);if(o.matches.length&&byStatus(o,"playing").length&&available(o).length>=need(o)){refill(o);o.updatedAt=Date.now();saveLocal();queueDb(o.id)}}
      view.animId=el.dataset.id;view.tab="matchs";view.editMatch=null;view.openPlayer=null;render();window.scrollTo(0,0);break;
    case "home":view.animId=null;render();window.scrollTo(0,0);break;
    case "tab":view.tab=el.dataset.tab;render();break;
    case "start":case "refill":{refill(a);commit(a);const p=byStatus(a,"playing").length;if(p<a.live)toast(`${p} matchs en jeu : pas assez de joueuses pour en lancer plus.`);break;}
    case "back":case "defi-win":{
      const m=findM();m.status="done";m.endedAt=Date.now();m.defiCount=act==="defi-win"?1:0;
      const before=byStatus(a,"planned")[0];
      refill(a,m);commit(a);
      if(before&&before.status==="playing")toast(`Match ${before.seq} part : ${team(a,before.a)} contre ${team(a,before.b)}`);
      break;}
    case "undo-back":{const m=findM();m.status="playing";m.endedAt=null;m.backAt=null;view.editMatch=null;commit(a);toast("Match remis en jeu");break;}
    case "redraw":{const m=findM();if(!redrawMatch(a,m))toast("Pas d'autre tirage possible pour l'instant.");commit(a);break;}
    case "set-live":{a.live=+el.dataset.v;refill(a);commit(a);toast(`${a.live} matchs en même temps : les prochains retours ne relancent pas de match tant qu'on n'est pas redescendu à ${a.live}.`);break;}
    case "dur":{a.duration=el.dataset.v?+el.dataset.v:null;commit(a);toast(a.duration?`Matchs de ${a.duration} minutes`:"Matchs sans limite de temps");break;}
    case "defi-plus":{const m=findM();m.defiCount=(m.defiCount||0)+1;commit(a);break;}
    case "defi-minus":{const m=findM();m.defiCount=Math.max(0,(m.defiCount||0)-1);commit(a);break;}
    case "win":{const m=findM();m.winner=m.winner===el.dataset.w?null:el.dataset.w;commit(a);break;}
    case "edit-match":view.editMatch=view.editMatch===el.dataset.id?null:el.dataset.id;render();break;
    case "add-players":{const names=parseNames(document.getElementById("add-players").value);if(!names.length)return;names.forEach(n=>a.players.push({id:uid(),name:n,present:true}));commit(a);toast(names.length+" ajoutée(s)");break;}
    case "pause":case "remove-confirm":{
      const p=a.players.find(x=>x.id===el.dataset.id);
      if(act==="pause")p.present=false;
      else{view.confirmRemove=null;if(a.matches.some(m=>m.a.concat(m.b).includes(p.id)))p.removed=true;else a.players=a.players.filter(x=>x.id!==p.id)}
      const n=dropFromPlanned(a,p.id);
      const live=isPlaying(a,p.id);
      commit(a);
      toast(`${p.name} ${act==="pause"?"en pause":"retirée"}${n?" · prochain match retiré":""}${live?" · son match en cours continue":""}`);
      break;}
    case "resume":case "restore":{const p=a.players.find(x=>x.id===el.dataset.id);p.present=true;p.removed=false;if(a.matches.length)refill(a);commit(a);toast(p.name+" reprend les tirages");break;}
    case "remove-player":view.confirmRemove=el.dataset.id;render();break;
    case "remove-cancel":view.confirmRemove=null;render();break;
    case "add-defi":{
      const v=document.getElementById("new-defi").value.trim();if(!v)return;
      const d={id:uid(),text:v};a.defis.push(d);
      if(!a.currentDefi)setCurrentDefi(a,d.id);
      commit(a);toast(a.currentDefi===d.id?"Défi ajouté et mis en jeu":"Défi ajouté. Coche « En jeu » pour le jouer.");
      setTimeout(()=>{const f=document.getElementById("new-defi");f&&f.focus()},0);break;}
    case "del-defi":a.defis=a.defis.filter(d=>d.id!==el.dataset.id);if(a.currentDefi===el.dataset.id)setCurrentDefi(a,null);commit(a);break;
    case "open-player":view.openPlayer=view.openPlayer===el.dataset.id?null:el.dataset.id;render();break;
    case "delete":view.confirmDel=a.id;render();break;
    case "delete-cancel":view.confirmDel=null;render();break;
    case "delete-confirm":{const id=a.id;delete store.animations[id];saveLocal();queueDb(id);view.animId=null;view.confirmDel=null;render();toast("Animation supprimée");break;}
  }
});
$app.addEventListener("change",e=>{
  const el=e.target;const act=el.dataset&&el.dataset.act;if(!act)return;
  const a=anim();if(!a)return;
  const m=a.matches.find(x=>x.id===el.dataset.id);
  if(act==="score"){m.score=el.value.trim();commit(a)}
  if(act==="defi-ok"){m.defiCount=el.checked?1:0;commit(a)}
  if(act==="match-defi"){m.defiId=el.value||null;m.defiCount=0;commit(a)}
  if(act==="cur-defi"||act==="cur-defi-radio"){setCurrentDefi(a,el.value);commit(a);toast(a.currentDefi?"Défi en jeu : "+defiText(a,a.currentDefi):"Plus de défi en jeu")}
  if(act==="present"){const p=a.players.find(x=>x.id===el.dataset.id);p.present=el.checked;commit(a)}
});
$app.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.id==="new-defi"){e.preventDefault();document.querySelector('[data-act="add-defi"]').click()}
});
let audio=null;const rung=new Set();
document.addEventListener("pointerdown",()=>{if(!audio){try{audio=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}},{once:false});
function beep(){if(!audio)return;try{[0,0.35,0.7].forEach(t=>{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=880;g.gain.setValueAtTime(0.25,audio.currentTime+t);g.gain.exponentialRampToValueAtTime(0.001,audio.currentTime+t+0.25);o.connect(g).connect(audio.destination);o.start(audio.currentTime+t);o.stop(audio.currentTime+t+0.3)})}catch(e){}}
setInterval(()=>{
  const a=view.animId&&store.animations[view.animId];if(!a)return;
  document.querySelectorAll(".court[data-mid]").forEach(card=>{
    const m=a.matches.find(x=>x.id===card.dataset.mid);if(!m||m.status!=="playing")return;
    const c=clock(a,m);card.querySelector(".clock").textContent=c.text;card.classList.toggle("over",c.over);
    if(c.over&&!rung.has(m.id)){rung.add(m.id);beep();try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}
  });
},1000);

loadLocal();render();connectDb();
})();
</script>

<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
</body></html>
